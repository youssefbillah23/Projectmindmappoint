version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pulsepoint
      POSTGRES_USER: pulsepoint
      POSTGRES_PASSWORD: pulsepoint_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://pulsepoint:pulsepoint_dev@postgres:5432/pulsepoint
      REDIS_URL: redis://redis:6379

volumes:
  postgres_data:
  redis_data:
